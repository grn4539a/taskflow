<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Sécurisé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ÉCRAN DE CONNEXION / INSCRIPTION -->
    <div id="login-screen" class="card-container">
        <h1 id="auth-title">Connexion</h1>
        <form id="auth-form">
            <div class="input-group">
                <label for="username">Identifiant</label>
                <input type="text" id="username" required placeholder="Entrez votre identifiant">
            </div>
            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="Entrez votre mot de passe">
                
                <div id="password-requirements" class="hidden">
                    <p class="req-item" id="req-length">❌ Au moins 8 caractères</p>
                    <p class="req-item" id="req-number">❌ Au moins 1 chiffre</p>
                    <p class="req-item" id="req-special">❌ Au moins 1 caractère spécial (@$!%*?&)</p>
                </div>
            </div>
            
            <p id="auth-error" class="error-text hidden"></p>
            <button type="submit" id="auth-submit-btn">Se connecter</button>
        </form>
        <p class="toggle-auth-text">
            <span id="auth-toggle-msg">Pas encore de compte ?</span> 
            <a href="#" id="auth-toggle-link">S'inscrire</a>
        </p>
    </div>

    <!-- ÉCRAN DES TÂCHES (Masqué par défaut) -->
    <div id="todo-screen" class="app-container hidden">
        <div class="todo-header card">
            <h1>TaskFlow</h1>
            <button id="logout-btn">Déconnexion</button>
        </div>
        
        <!-- Formulaire d'ajout -->
        <div class="card">
            <form id="task-form">
                <input type="text" id="task-title" required placeholder="Titre de la tâche...">
                <div class="form-row">
                    <select id="task-priority" required>
                        <option value="haute">Haute</option>
                        <option value="moyenne" selected>Moyenne</option>
                        <option value="basse">Basse</option>
                    </select>
                    <select id="task-category" required>
                        <option value="cours">Cours</option>
                        <option value="perso" selected>Perso</option>
                        <option value="projet">Projet</option>
                    </select>
                    <input type="date" id="task-due-date" required>
                    <button type="submit">Ajouter</button>
                </div>
            </form>
        </div>

        <!-- Outils de recherche et de tri -->
        <div class="card controls">
            <input type="text" id="search-input" placeholder="Rechercher une tâche...">
            <div class="filter-actions">
                <div class="filter-tabs">
                    <button class="tab-btn active" data-status="toutes">Toutes</button>
                    <button class="tab-btn" data-status="a_faire">À faire</button>
                    <button class="tab-btn" data-status="terminee">Terminées</button>
                </div>
                <select id="sort-select">
                    <option value="echeance-asc">Échéance : À venir en premier</option>
                    <option value="echeance-desc">Échéance : Plus tard en premier</option>
                    <option value="priorite-desc">Priorité : Haute d'abord</option>
                    <option value="priorite-asc">Priorité : Basse d'abord</option>
                </select>
            </div>
        </div>

        <!-- Liste des tâches -->
        <ul id="task-list" class="task-list">
            <!-- Rendu dynamique JS -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
