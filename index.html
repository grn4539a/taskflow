<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="taskflow" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Tâches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h1>Ma Liste de Tâches</h1>
        
        <div class="input-section">
            <input type="text" id="task-input" placeholder="Ajouter une nouvelle tâche...">
            <button id="add-task-btn">Ajouter</button>
        </div>

        <ul id="task-list">
            <!-- Les tâches s'afficheront ici dynamiquement -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
